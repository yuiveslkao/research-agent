schema  = "run/0.1"
kind    = "check"
mode    = "exploration"
purpose = "planted-flaw test (expected violated): C-0003"

[code]
commit = "HEAD"
cwd    = "workspace"
cmd    = ["julia", "--project=envs/main", "../checkers/falsify.jl"]

[env]
kind    = "julia-project"
project = "envs/main"
julia   = "1.11.3"        # must match an existing julia:<tag> Docker image

[numerics]
arithmetic     = "BigFloat"
precision_bits = 512
rng            = "Xoshiro"
seeds          = [1]
determinism    = "bitwise"
device         = "cpu"

[resources]
threads    = 1
mem_gb     = 6
gpu        = false
walltime_s = 7200

[params]
statement = "statements/C0003.jl"
module    = "C0003"
evals     = 2000
starts    = 8
