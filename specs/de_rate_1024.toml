schema  = "run/0.1"
kind    = "experiment"
mode    = "exploration"
purpose = "Same study at 1024 bits, for precision-escalation comparison with de_rate"

[code]
commit = "HEAD"
cwd    = "workspace"
cmd    = ["julia", "--project=envs/main", "scripts/de_rate.jl"]

[env]
kind    = "julia-project"
project = "envs/main"
julia   = "1.11.3"        # must match an existing julia:<tag> Docker image

[numerics]
arithmetic     = "BigFloat"
precision_bits = 1024
rng            = "Xoshiro"
seeds          = [1]
determinism    = "bitwise"
device         = "cpu"

[resources]
threads    = 1
mem_gb     = 8
gpu        = false
walltime_s = 3600

[params]
a = "0.5"
b = "1.5"
d = "1"
N = [8, 16, 32, 64, 128]
